<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% if page.title %}{{ page.title }} — {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
<meta name="description" content="{{ page.description | default: site.description }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Noto+Sans+JP:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --yellow: #FFE44D;
    --pink: #FF6B9D;
    --blue: #4ECDC4;
    --dark: #1a1a2e;
    --ink: #0d0d0d;
    --white: #fffef5;
    --border: 3px solid var(--ink);
    --shadow: 5px 5px 0 var(--ink);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--white);
    color: var(--ink);
    font-family: 'Noto Sans JP', sans-serif;
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: radial-gradient(circle, #00000015 1px, transparent 1px);
    background-size: 24px 24px;
    pointer-events: none;
    z-index: 0;
  }

  /* ヘッダー */
  header {
    background: var(--yellow);
    border-bottom: var(--border);
    padding: 1.5rem 2rem;
    position: relative;
    z-index: 10;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 1rem;
  }

  .site-title {
    font-family: 'Bangers', cursive;
    font-size: clamp(2rem, 6vw, 3.5rem);
    letter-spacing: 3px;
    color: var(--ink);
    text-shadow: 3px 3px 0 var(--pink);
    line-height: 1;
    text-decoration: none;
    display: inline-block;
  }

  .site-title span {
    color: var(--pink);
    text-shadow: 3px 3px 0 var(--dark);
  }

  .badge {
    background: var(--pink);
    color: var(--white);
    font-size: 0.75rem;
    font-weight: 700;
    padding: 4px 12px;
    border: var(--border);
    box-shadow: var(--shadow);
    transform: rotate(-2deg);
    display: inline-block;
    letter-spacing: 1px;
    margin-top: 0.4rem;
  }

  nav {
    display: flex;
    gap: 0.5rem;
    flex-wrap: wrap;
  }

  nav a {
    font-weight: 700;
    font-size: 0.85rem;
    color: var(--ink);
    text-decoration: none;
    padding: 6px 14px;
    border: var(--border);
    background: var(--white);
    box-shadow: 3px 3px 0 var(--ink);
    transition: transform 0.1s, box-shadow 0.1s;
    letter-spacing: 0.5px;
  }

  nav a:hover {
    transform: translate(-2px, -2px);
    box-shadow: 5px 5px 0 var(--ink);
    background: var(--blue);
  }

  /* メインレイアウト */
  main {
    max-width: 960px;
    margin: 0 auto;
    padding: 2rem 1.5rem;
    position: relative;
    z-index: 1;
  }

  /* ヒーローセクション */
  .hero {
    background: var(--pink);
    border: var(--border);
    box-shadow: var(--shadow);
    padding: 2rem;
    margin-bottom: 2rem;
    position: relative;
    overflow: hidden;
  }

  .hero::after {
    content: '★';
    font-size: 8rem;
    position: absolute;
    right: -1rem;
    top: -1rem;
    opacity: 0.12;
    line-height: 1;
  }

  .hero h1 {
    font-family: 'Bangers', cursive;
    font-size: clamp(1.8rem, 5vw, 3rem);
    letter-spacing: 2px;
    color: var(--white);
    text-shadow: 2px 2px 0 var(--ink);
    margin-bottom: 0.75rem;
  }

  .hero p {
    color: var(--white);
    font-size: 1rem;
    line-height: 1.7;
    max-width: 480px;
    font-weight: 400;
  }

  .hero p strong {
    background: var(--yellow);
    color: var(--ink);
    padding: 0 4px;
    font-weight: 700;
  }

  /* セクションタイトル */
  .section-title {
    font-family: 'Bangers', cursive;
    font-size: 1.8rem;
    letter-spacing: 2px;
    margin-bottom: 1.25rem;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .section-title::before {
    content: '';
    display: inline-block;
    width: 18px;
    height: 18px;
    background: var(--yellow);
    border: 2px solid var(--ink);
    transform: rotate(45deg);
    flex-shrink: 0;
  }

  /* 記事カード */
  .cards {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 1.25rem;
    margin-bottom: 2.5rem;
  }

  .card {
    background: var(--white);
    border: var(--border);
    box-shadow: var(--shadow);
    padding: 1.25rem;
    transition: transform 0.15s, box-shadow 0.15s;
    position: relative;
  }

  .card:hover {
    transform: translate(-3px, -3px);
    box-shadow: 8px 8px 0 var(--ink);
  }

  .card-tag {
    display: inline-block;
    font-size: 0.7rem;
    font-weight: 700;
    letter-spacing: 1px;
    padding: 3px 10px;
    border: 2px solid var(--ink);
    margin-bottom: 0.75rem;
  }

  .card-tag.yellow { background: var(--yellow); }
  .card-tag.blue   { background: var(--blue); }
  .card-tag.pink   { background: var(--pink); color: var(--white); }

  .card h3 {
    font-size: 1rem;
    font-weight: 900;
    margin-bottom: 0.5rem;
    line-height: 1.4;
  }

  .card p {
    font-size: 0.875rem;
    color: #444;
    line-height: 1.6;
  }

  .card-date {
    font-size: 0.75rem;
    color: #888;
    margin-top: 0.75rem;
    font-weight: 700;
  }

  /* 今週のまとめ */
  .weekly {
    background: var(--blue);
    border: var(--border);
    box-shadow: var(--shadow);
    padding: 1.5rem;
    margin-bottom: 2.5rem;
  }

  .weekly .section-title { color: var(--ink); }

  .weekly ul {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 0.6rem;
  }

  .weekly ul li {
    font-size: 0.9rem;
    font-weight: 700;
    display: flex;
    align-items: flex-start;
    gap: 8px;
    line-height: 1.5;
  }

  .weekly ul li::before {
    content: '▶';
    font-size: 0.7rem;
    margin-top: 3px;
    flex-shrink: 0;
    color: var(--ink);
  }

  /* 投稿ページ */
  .post-article {
    max-width: 720px;
  }

  .post-title {
    font-size: clamp(1.4rem, 4vw, 2rem);
    font-weight: 900;
    line-height: 1.3;
    margin: 0.75rem 0 0.5rem;
  }

  .post-body {
    background: var(--white);
    border: var(--border);
    box-shadow: var(--shadow);
    padding: 1.75rem;
    margin-top: 1.5rem;
  }

  .post-body h2 {
    font-family: 'Bangers', cursive;
    font-size: 1.5rem;
    letter-spacing: 1px;
    margin: 2rem 0 0.75rem;
    padding-bottom: 0.4rem;
    border-bottom: 3px solid var(--ink);
  }

  .post-body h3 {
    font-size: 1rem;
    font-weight: 900;
    margin: 1.5rem 0 0.5rem;
  }

  .post-body p {
    font-size: 0.95rem;
    line-height: 1.9;
    margin-bottom: 1rem;
    color: #222;
  }

  .post-body ul, .post-body ol {
    margin: 0.5rem 0 1rem 1.5rem;
    line-height: 1.9;
    font-size: 0.95rem;
    color: #222;
  }

  .post-body li { margin-bottom: 0.25rem; }

  .post-body code {
    background: var(--dark);
    color: var(--yellow);
    padding: 2px 8px;
    font-family: monospace;
    font-size: 0.85em;
  }

  .post-body pre {
    background: var(--dark);
    color: #e8e8f0;
    padding: 1rem 1.25rem;
    overflow-x: auto;
    margin: 1rem 0;
    border: var(--border);
    box-shadow: var(--shadow);
  }

  .post-body pre code {
    background: none;
    color: inherit;
    padding: 0;
    font-size: 0.875rem;
  }

  .post-body blockquote {
    border-left: 4px solid var(--pink);
    padding: 0.5rem 1rem;
    margin: 1rem 0;
    background: rgba(255,107,157,0.07);
    font-style: italic;
    color: #444;
  }

  .post-body img {
    max-width: 100%;
    border: var(--border);
    box-shadow: var(--shadow);
  }

  .back-btn {
    display: inline-block;
    margin-top: 2rem;
    font-weight: 700;
    font-size: 0.85rem;
    color: var(--ink);
    text-decoration: none;
    padding: 8px 18px;
    border: var(--border);
    background: var(--white);
    box-shadow: var(--shadow);
    transition: transform 0.1s, box-shadow 0.1s;
  }

  .back-btn:hover {
    transform: translate(-2px, -2px);
    box-shadow: 7px 7px 0 var(--ink);
    background: var(--yellow);
  }

  /* フッター */
  footer {
    background: var(--dark);
    color: var(--yellow);
    text-align: center;
    padding: 1.5rem;
    border-top: var(--border);
    font-family: 'Bangers', cursive;
    font-size: 1.1rem;
    letter-spacing: 2px;
    position: relative;
    z-index: 10;
  }

  footer span { color: var(--pink); }

  /* アニメーション */
  @keyframes popIn {
    from { opacity: 0; transform: translateY(20px) scale(0.95); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }

  .card, .hero, .weekly, .post-body {
    animation: popIn 0.4s ease both;
  }

  .card:nth-child(1) { animation-delay: 0.05s; }
  .card:nth-child(2) { animation-delay: 0.1s; }
  .card:nth-child(3) { animation-delay: 0.15s; }
  .card:nth-child(4) { animation-delay: 0.2s; }
  .card:nth-child(5) { animation-delay: 0.25s; }
  .card:nth-child(6) { animation-delay: 0.3s; }
</style>
</head>
<body>

<header>
  <div>
    <a href="{{ '/' | relative_url }}" class="site-title">MY <span>WORLD</span></a>
    <div class="badge">✦ 活動記録ブログ ✦</div>
  </div>
  <nav>
    <a href="{{ '/' | relative_url }}">HOME</a>
    <a href="{{ '/howto.html' | relative_url }}">📖 作り方</a>
  </nav>
</header>

{{ content }}

<footer>
  MADE WITH <span>♥</span> — MY WORLD © 2026
</footer>

</body>
</html>
